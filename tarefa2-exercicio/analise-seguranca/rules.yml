# Regras de SAST customizadas (estilo Semgrep), usadas pelo scanner sast_scan.js
# porque o registry oficial do Semgrep não estava acessível no ambiente de execução.
# Cada regra é um regex aplicado linha a linha sobre os arquivos .js do projeto,
# mapeada a uma vulnerabilidade V1-V20 e a uma categoria OWASP Top 10 (2021).

rules:
  - id: hardcoded-jwt-secret
    pattern: "SECRET\\s*=\\s*[\"'].+[\"']"
    message: "Secret JWT hardcoded no código-fonte (V1)"
    owasp: "A02:2021 - Cryptographic Failures"
    severity: HIGH

  - id: sql-string-concat-template
    pattern: "(SELECT|INSERT|UPDATE|DELETE).*\\$\\{"
    message: "Query SQL montada por concatenação/template string (V2/V6/V9)"
    owasp: "A03:2021 - Injection"
    severity: HIGH

  - id: jwt-sign-no-expiry
    pattern: "jwt\\.sign\\((?![^)]*expiresIn)[^;]*\\)"
    message: "jwt.sign sem opção expiresIn — token não expira (V3)"
    owasp: "A07:2021 - Identification and Authentication Failures"
    severity: MEDIUM

  - id: auth-header-token
    pattern: "req\\.headers\\.authorization"
    message: "Token lido diretamente do header Authorization, sem cookie HttpOnly (V5/V12)"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: MEDIUM

  - id: missing-ownership-check
    pattern: "router\\.get\\('/orders/:id'.*"
    message: "Revisar manualmente: rota de recurso por ID deve checar propriedade (V7)"
    owasp: "A01:2021 - Broken Access Control"
    severity: INFO

  - id: admin-route-no-role-check
    pattern: "router\\.get\\('/admin/.*',\\s*authMiddleware,\\s*async"
    message: "Rota /admin sem middleware de checagem de role antes do handler (V10)"
    owasp: "A01:2021 - Broken Access Control"
    severity: HIGH

  - id: dangerously-set-inner-html
    pattern: "dangerouslySetInnerHTML"
    message: "Uso de dangerouslySetInnerHTML sem sanitização visível (V15 — XSS)"
    owasp: "A03:2021 - Injection"
    severity: HIGH

  - id: cors-open
    pattern: "cors\\(\\)\\s*\\)"
    message: "cors() chamado sem opções — aceita qualquer origem (V16)"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: MEDIUM

  - id: json-body-no-limit
    pattern: "express\\.json\\(\\)\\s*\\)"
    message: "express.json() sem limite de tamanho (V17)"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: LOW

  - id: missing-helmet
    pattern: "^(?!.*helmet).*app\\.listen"
    message: "Servidor sobe sem helmet() configurado (V19)"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: MEDIUM

  - id: error-handler-exposes-stack
    pattern: "stack:\\s*err\\.stack"
    message: "Error handler retorna err.stack ao cliente (V20)"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: MEDIUM

  - id: plaintext-password-compare
    pattern: "password\\s*=\\s*'\\$\\{password\\}'"
    message: "Senha comparada em texto claro na query, sem hashing (V2)"
    owasp: "A02:2021 - Cryptographic Failures"
    severity: HIGH
